# Surge STUN/TURN 统一规则集
# 核对日期: 2026-10-24
# 本文件不含策略名称, 由主配置中的 RULE-SET 引用指定策略.
# 三段仅用于分类, 所有命中规则均使用引用指定的同一策略.
# 地区分类依据公开的服务和部署信息, 不保证节点实际位置或持续可用.
# 建议将本规则集引用置于宽泛直连规则之前, 排在前面的规则仍会优先命中.
# Surge 需要接管相应流量, UDP 代理出口也需要支持 UDP 转发.
# 不允许不支持 UDP 时回退直连, 请在主配置的 [General] 中设置:
# udp-policy-not-supported-behaviour = REJECT

