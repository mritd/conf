# Surge AI 服务规则集
# 核对日期: 2026-10-24
# 由主配置中的 RULE-SET 引用指定策略, 本文件仅包含规则集内容.
# 如需统一 AI 出口, 请将引用规则放在宽泛的域名和 IP 规则之前.
# 语音使用 UDP 时, 代理出口需要支持 UDP 转发.
