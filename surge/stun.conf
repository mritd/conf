# ==================================================
# 第三段: STUN 协议识别与常用端口兜底
# ==================================================
# 本段不区分地区, 端口匹配不保证目标服务一定属于 STUN/TURN.
# 来源:
# https://manual.nssurge.com/rules/protocol-and-network.html
# https://manual.nssurge.com/rules/source-and-port.html
# https://manual.nssurge.com/rules/logical.html
# https://www.rfc-editor.org/rfc/rfc8489.html
# https://www.rfc-editor.org/rfc/rfc8656.html
# https://knowledge.workspace.google.com/admin/meet/prepare-your-network-for-meet-meetings-and-live-streams

# 按 Surge 识别出的 STUN 协议匹配, 补充域名表和常见端口之外的请求.
# 不保证识别 TLS/DTLS 加密内部的 STUN, 也不覆盖所有 WebRTC 媒体流量.
PROTOCOL,STUN

# STUN/TURN 标准目标端口, 同时匹配 TCP 和 UDP.
# 相同端口上的其他服务也可能匹配.
DEST-PORT,3478

# STUN/TURN 加密传输的标准端口, 包括 TLS over TCP 和 DTLS over UDP.
DEST-PORT,5349

# 谷歌常用 STUN 端口为 UDP 19302.
# 同时覆盖 Google Meet 官方列出的 UDP 19302-19309 范围, 也可能匹配相关媒体流量.
AND,((PROTOCOL,UDP),(DEST-PORT,19302-19309))

# TURN 也可能复用 443 或其他自定义端口, 此处不全局匹配 443.
# 443 交由已知服务域名规则处理, 避免影响普通 HTTPS 和 QUIC 连接.
